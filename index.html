
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SALONE: WILD REALMS</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#91a98a;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white}
#top{position:absolute;top:18px;left:18px;text-shadow:0 2px 5px #000}
#top h2{margin:0;font-size:17px;letter-spacing:2px}
#top small{color:#d9e7d1}
#status{position:absolute;top:20px;right:18px;background:#15271d99;padding:9px 13px;border-radius:20px;font-size:11px}
#joystick{position:absolute;bottom:30px;left:25px;width:125px;height:125px;border:2px solid #ffffff66;background:#ffffff20;border-radius:50%;pointer-events:auto}
#stick{position:absolute;left:37px;top:37px;width:47px;height:47px;background:#ffffffaa;border:2px solid white;border-radius:50%}
#look{position:absolute;right:0;bottom:0;width:52%;height:55%;pointer-events:auto}
#hint{position:absolute;bottom:12px;right:15px;font-size:10px;color:#fff;text-shadow:0 1px 4px #000}
#loading{position:absolute;inset:0;background:#14271d;display:grid;place-items:center;text-align:center}
#loading h1{letter-spacing:4px}
#loading p{color:#c1d3bd;font-size:13px}
</style>
</head>
<body>
<div id="hud">
 <div id="top"><h2>SALONE: WILD REALMS</h2><small>THE FOREST FRONTIER</small></div>
 <div id="status">WORLD INITIALIZING</div>
 <div id="joystick"><div id="stick"></div></div>
 <div id="look"></div>
 <div id="hint">LEFT: MOVE · RIGHT: LOOK</div>
</div>
<div id="loading"><div><h1>SALONE</h1><p>Entering the wild...</p></div></div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bb7c0);
scene.fog = new THREE.FogExp2(0x9bb7c0,0.009);

const camera = new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,0.1,500
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc9e6ff,0x465337,2));

const sun = new THREE.DirectionalLight(0xffe5bd,3);
sun.position.set(-40,70,35);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// Natural rolling terrain
function heightAt(x,z){
 return Math.sin(x*.035)*1.7+
 Math.cos(z*.04)*1.3+
 Math.sin((x+z)*.025)*1.2;
}
const terrainGeo=new THREE.PlaneGeometry(300,300,100,100);
terrainGeo.rotateX(-Math.PI/2);
const positions=terrainGeo.attributes.position;
for(let i=0;i<positions.count;i++){
 const x=positions.getX(i);
 const z=positions.getZ(i);
 positions.setY(i,heightAt(x,z));
}
terrainGeo.computeVertexNormals();

const ground=new THREE.Mesh(
 terrainGeo,
 new THREE.MeshStandardMaterial({
  color:0x526b3c,roughness:1
 })
);
ground.receiveShadow=true;
scene.add(ground);

// Natural winding dirt trail
const points=[];
for(let i=0;i<80;i++){
 const z=80-i*2;
 const x=Math.sin(i*.055)*10;
 points.push(new THREE.Vector3(x,heightAt(x,z)+.06,z));
}
const path=new THREE.CatmullRomCurve3(points);
const road=new THREE.Mesh(
 new THREE.TubeGeometry(path,180,2.2,8,false),
 new THREE.MeshStandardMaterial({color:0x927b55,roughness:1})
);
scene.add(road);

// Tree creation
function makeTree(x,z,scale){
 const group=new THREE.Group();
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.32,3.5,7),
  new THREE.MeshStandardMaterial({color:0x60432b})
 );
 trunk.position.y=1.75;
 trunk.castShadow=true;
 group.add(trunk);

 const shades=[0x294c2c,0x365c30,0x416a36,0x24442a];
 for(let i=0;i<4;i++){
  const crown=new THREE.Mesh(
   new THREE.IcosahedronGeometry(1.6-i*.13,1),
   new THREE.MeshStandardMaterial({
    color:shades[i],roughness:1
   })
  );
  crown.position.set(
   (Math.random()-.5)*.6,
   3.1+i*.55,
   (Math.random()-.5)*.6
  );
  crown.scale.set(1.15,1.05,1.1);
  crown.castShadow=true;
  group.add(crown);
 }
 group.position.set(x,heightAt(x,z),z);
 group.scale.setScalar(scale);
 scene.add(group);
}

// Rocks and small vegetation
function makeRock(x,z){
 const rock=new THREE.Mesh(
  new THREE.DodecahedronGeometry(.5+Math.random()*.7,1),
  new THREE.MeshStandardMaterial({color:0x777b70,roughness:1})
 );
 rock.position.set(x,heightAt(x,z)+.25,z);
 rock.rotation.set(Math.random(),Math.random(),Math.random());
 rock.scale.y=.55;
 rock.castShadow=true;
 scene.add(rock);
}

// Build forest while keeping the starting trail clear
for(let i=0;i<260;i++){
 const x=(Math.random()-.5)*240;
 const z=(Math.random()-.5)*240;
 if(Math.abs(x-Math.sin((80-z)/2/.055)*10)<9 && z<80 && z>-80)continue;
 makeTree(x,z,.75+Math.random()*.8);
}
for(let i=0;i<110;i++){
 const x=(Math.random()-.5)*180;
 const z=(Math.random()-.5)*180;
 makeRock(x,z);
}

// River
const riverPoints=[
 new THREE.Vector3(45,0,100),
 new THREE.Vector3(39,0,55),
 new THREE.Vector3(44,0,10),
 new THREE.Vector3(34,0,-35),
 new THREE.Vector3(48,0,-100)
];
riverPoints.forEach(p=>p.y=heightAt(p.x,p.z)+.12);
const riverCurve=new THREE.CatmullRomCurve3(riverPoints);
const river=new THREE.Mesh(
 new THREE.TubeGeometry(riverCurve,100,2.8,12,false),
 new THREE.MeshStandardMaterial({
  color:0x478eae,roughness:.22,metalness:.1
 })
);
scene.add(river);

// Temporary player model
const player=new THREE.Group();
const bodyMat=new THREE.MeshStandardMaterial({color:0x345d43});
const skinMat=new THREE.MeshStandardMaterial({color:0x986c4e});
const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(.43,.75,5,8),bodyMat
);
body.position.y=1.15;
body.castShadow=true;
player.add(body);
const head=new THREE.Mesh(
 new THREE.SphereGeometry(.31,16,12),skinMat
);
head.position.y=2;
head.castShadow=true;
player.add(head);
const legs=[];
for(let i=0;i<2;i++){
 const leg=new THREE.Mesh(
  new THREE.CapsuleGeometry(.14,.58,4,6),
  new THREE.MeshStandardMaterial({color:0x303c32})
 );
 leg.position.set(i===0?-.2:.2,.38,0);
 player.add(leg);
 legs.push(leg);
}
player.position.set(0,heightAt(0,0),0);
scene.add(player);

// Camera and controls
let yaw=0;
let pitch=.22;
let moveX=0,moveY=0;
let walking=false;
const status=document.getElementById('status');
const stick=document.getElementById('stick');
const joystick=document.getElementById('joystick');
const look=document.getElementById('look');

let joyId=null,lookId=null;
let lastX=0,lastY=0;

function setJoy(e){
 const r=joystick.getBoundingClientRect();
 const dx=e.clientX-(r.left+r.width/2);
 const dy=e.clientY-(r.top+r.height/2);
 const max=37;
 const len=Math.hypot(dx,dy)||1;
 const factor=Math.min(1,max/len);
 const x=dx*factor,y=dy*factor;
 stick.style.transform=`translate(${x}px,${y}px)`;
 moveX=x/max;
 moveY=-y/max;
}

joystick.addEventListener('pointerdown',e=>{
 joyId=e.pointerId;
 joystick.setPointerCapture(joyId);
 setJoy(e);
});
joystick.addEventListener('pointermove',e=>{
 if(e.pointerId===joyId)setJoy(e);
});
function releaseJoy(e){
 if(e.pointerId!==joyId)return;
 joyId=null;moveX=0;moveY=0;
 stick.style.transform='translate(0,0)';
}
joystick.addEventListener('pointerup',releaseJoy);
joystick.addEventListener('pointercancel',releaseJoy);

look.addEventListener('pointerdown',e=>{
 lookId=e.pointerId;
 lastX=e.clientX;lastY=e.clientY;
 look.setPointerCapture(lookId);
});
look.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookId)return;
 yaw-=(e.clientX-lastX)*.006;
 pitch=Math.max(-.1,Math.min(.8,pitch+(e.clientY-lastY)*.004));
 lastX=e.clientX;lastY=e.clientY;
});
look.addEventListener('pointerup',e=>{lookId=null});
look.addEventListener('pointercancel',e=>{lookId=null});

// Desktop controls
const keys={};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const clock=new THREE.Clock();
let elapsed=0;

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 elapsed+=dt;

 let mx=moveX,my=moveY;
 if(keys.w||keys.arrowup)my=1;
 if(keys.s||keys.arrowdown)my=-1;
 if(keys.a||keys.arrowleft)mx=-1;
 if(keys.d||keys.arrowright)mx=1;

 const moving=Math.hypot(mx,my)>.08;
 walking=moving;
 if(moving){
  const speed=keys.shift?9:5;
  const dx=(mx*Math.cos(yaw)-my*Math.sin(yaw))*speed*dt;
  const dz=(-mx*Math.sin(yaw)-my*Math.cos(yaw))*speed*dt;
  player.position.x+=dx;
  player.position.z+=dz;
  player.rotation.y=Math.atan2(dx,dz);
  legs[0].rotation.x=Math.sin(elapsed*10)*.55;
  legs[1].rotation.x=-Math.sin(elapsed*10)*.55;
 }else{
  legs.forEach(l=>l.rotation.x=0);
 }

 player.position.y=heightAt(player.position.x,player.position.z);

 const distance=8;
 const target=new THREE.Vector3(
  player.position.x+Math.sin(yaw)*distance*Math.cos(pitch),
  player.position.y+2.1+Math.sin(pitch)*distance,
  player.position.z+Math.cos(yaw)*distance*Math.cos(pitch)
 );
 camera.position.lerp(target,.09);
 camera.lookAt(
  player.position.x,
  player.position.y+1.25,
  player.position.z
 );

 status.textContent=moving?'EXPLORING THE FOREST':'WORLD READY';
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
document.getElementById('loading').style.display='none';
</script>
</body>
</html>
