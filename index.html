
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17251c">
<title>SALONE: WILD REALMS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ba78b;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;z-index:2}
#brand{position:absolute;top:16px;left:17px;text-shadow:0 2px 8px #102015}
#brand b{display:block;font-size:15px;letter-spacing:2px}
#brand small{font-size:9px;letter-spacing:2px;color:#dce8d5}
#status{position:absolute;top:16px;right:14px;padding:9px 12px;border:1px solid #ffffff35;border-radius:20px;background:#14251dbb;font-size:10px;letter-spacing:1px}
#joystick{position:absolute;left:22px;bottom:24px;width:116px;height:116px;border:1px solid #ffffff70;background:#ffffff20;border-radius:50%;pointer-events:auto;backdrop-filter:blur(3px)}
#stick{position:absolute;left:34px;top:34px;width:46px;height:46px;border-radius:50%;background:#e8eee0cc;border:2px solid #fff;box-shadow:0 2px 12px #0005}
#look{position:absolute;right:0;bottom:0;width:55%;height:60%;pointer-events:auto}
#hint{position:absolute;right:15px;bottom:13px;font-size:9px;letter-spacing:1px;color:#fff;text-shadow:0 2px 5px #000}
#loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:linear-gradient(#14291e,#263c2b);color:white;text-align:center}
#loading b{font-size:27px;letter-spacing:5px}
#loading p{font-size:11px;letter-spacing:2px;color:#c5d5bd}
#quality{position:absolute;top:57px;right:14px;pointer-events:auto;background:#14251d99;color:#fff;border:1px solid #ffffff40;border-radius:15px;padding:6px 9px;font-size:9px}
</style>
</head>
<body>
<div id="hud">
 <div id="brand"><b>SALONE: WILD REALMS</b><small>THE FOREST FRONTIER</small></div>
 <div id="status">LOADING WORLD</div>
 <button id="quality">GRAPHICS: BALANCED</button>
 <div id="joystick"><div id="stick"></div></div>
 <div id="look"></div>
 <div id="hint">LEFT: MOVE · RIGHT: LOOK</div>
</div>
<div id="loading"><div><b>SALONE</b><p>PREPARING THE WILD FRONTIER</p></div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bb8bd);
scene.fog=new THREE.FogExp2(0xa5b9ae,0.0068);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:'high-performance'
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9efff,0x48533a,1.8));

const sun=new THREE.DirectionalLight(0xffe4bd,2.35);
sun.position.set(-55,85,35);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-55;
sun.shadow.camera.right=55;
sun.shadow.camera.top=55;
sun.shadow.camera.bottom=-55;
sun.shadow.normalBias=.035;
scene.add(sun);

const fill=new THREE.DirectionalLight(0x9dbbce,.55);
fill.position.set(45,25,-35);
scene.add(fill);

// Deterministic random generator
let seed=87431;
function rand(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}

// Terrain height
function noise(x,z){
 return (
 Math.sin(x*.047+Math.cos(z*.031)*1.7)+
 Math.cos(z*.061+x*.019)*.65+
 Math.sin((x+z)*.105)*.22+
 Math.cos((x-z)*.19)*.08
 );
}

function heightAt(x,z){
 return noise(x,z)*2+
 Math.sin(x*.012)*2.2+
 Math.cos(z*.014)*1.4;
}

// Natural terrain
const terrainGeo=new THREE.PlaneGeometry(260,260,150,150);
terrainGeo.rotateX(-Math.PI/2);

const pos=terrainGeo.attributes.position;
const colors=[];

const c1=new THREE.Color(0x344b2c);
const c2=new THREE.Color(0x647548);
const c3=new THREE.Color(0x887c59);
const c4=new THREE.Color(0x526044);

for(let i=0;i<pos.count;i++){
 const x=pos.getX(i);
 const z=pos.getZ(i);
 const h=heightAt(x,z);

 pos.setY(i,h);

 const c=c1.clone().lerp(
  c2,
  THREE.MathUtils.clamp((h+3)/7,0,1)
 );

 if(h>2.7){
  c.lerp(c3,THREE.MathUtils.clamp((h-2.7)/3,0,.55));
 }

 c.lerp(c4,rand()*.10);
 colors.push(c.r,c.g,c.b);
}

terrainGeo.setAttribute(
 'color',
 new THREE.Float32BufferAttribute(colors,3)
);
terrainGeo.computeVertexNormals();

// Procedural soil texture
const texCanvas=document.createElement('canvas');
texCanvas.width=256;
texCanvas.height=256;

const ctx=texCanvas.getContext('2d');
ctx.fillStyle='#796b4d';
ctx.fillRect(0,0,256,256);

for(let i=0;i<6500;i++){
 const v=rand();
 ctx.fillStyle=v>.5?
  'rgba(40,52,30,.18)':
  'rgba(207,185,133,.16)';
 ctx.fillRect(rand()*256,rand()*256,1+rand()*3,1+rand()*2);
}

const soilTex=new THREE.CanvasTexture(texCanvas);
soilTex.wrapS=soilTex.wrapT=THREE.RepeatWrapping;
soilTex.repeat.set(18,18);
soilTex.colorSpace=THREE.SRGBColorSpace;

const ground=new THREE.Mesh(
 terrainGeo,
 new THREE.MeshStandardMaterial({
  vertexColors:true,
  map:soilTex,
  roughness:1
 })
);
ground.receiveShadow=true;
scene.add(ground);

// Terrain-following ribbon
function ribbon(points,width,material,yOffset=0){
 const verts=[],uv=[],indices=[];

 for(let i=0;i<points.length;i++){
  const p=points[i];
  const prev=points[Math.max(0,i-1)];
  const next=points[Math.min(points.length-1,i+1)];

  const tangent=new THREE.Vector3(
   next.x-prev.x,0,next.z-prev.z
  ).normalize();

  const side=new THREE.Vector3(-tangent.z,0,tangent.x);

  for(const s of [-1,1]){
   const x=p.x+side.x*width*s;
   const z=p.z+side.z*width*s;

   verts.push(x,heightAt(x,z)+yOffset,z);
   uv.push(0,i/points.length);
  }

  if(i<points.length-1){
   const a=i*2;
   indices.push(a,a+1,a+2,a+1,a+3,a+2);
  }
 }

 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
 g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
 g.setIndex(indices);
 g.computeVertexNormals();

 return new THREE.Mesh(g,material);
}

// Winding forest trail
const trackPoints=[];
for(let i=0;i<=110;i++){
 const z=100-i*1.85;
 const x=Math.sin(i*.045)*8+Math.sin(i*.013)*3;
 trackPoints.push(new THREE.Vector3(x,0,z));
}

scene.add(ribbon(
 trackPoints,
 2.7,
 new THREE.MeshStandardMaterial({
  color:0x806c4b,
  roughness:1,
  side:THREE.DoubleSide
 }),
 .045
));

// River and banks
const riverPoints=[];
for(let i=0;i<=70;i++){
 const z=105-i*3;
 const x=48+Math.sin(i*.075)*7+Math.cos(i*.03)*4;
 riverPoints.push(new THREE.Vector3(x,0,z));
}

scene.add(ribbon(
 riverPoints,3.1,
 new THREE.MeshStandardMaterial({
  color:0x387f91,
  roughness:.23,
  metalness:.08,
  transparent:true,
  opacity:.94,
  side:THREE.DoubleSide
 }),
 .18
));

scene.add(ribbon(
 riverPoints,3.55,
 new THREE.MeshStandardMaterial({
  color:0x9a9870,
  roughness:1,
  side:THREE.DoubleSide
 }),
 .08
));

// Instanced trees
const trunkGeo=new THREE.CylinderGeometry(.19,.34,3.8,7);
const leafGeo=new THREE.IcosahedronGeometry(1.65,1);

const trunkMat=new THREE.MeshStandardMaterial({
 color:0x59412c,
 roughness:1
});
const leafMat=new THREE.MeshStandardMaterial({
 color:0x365a35,
 roughness:1
});

const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,260);
const crowns=new THREE.InstancedMesh(leafGeo,leafMat,780);

trunks.castShadow=true;
crowns.castShadow=false;

const dummy=new THREE.Object3D();
let ti=0,ci=0;

function nearTrack(x,z){
 const expected=
 Math.sin((100-z)/1.85*.045)*8+
 Math.sin((100-z)/1.85*.013)*3;

 return Math.abs(x-expected)<7&&z<100&&z>-104;
}

for(let i=0;i<260;i++){
 let x,z;

 do{
  x=(rand()-.5)*238;
  z=(rand()-.5)*238;
 }while(nearTrack(x,z)||Math.abs(x-48)<7);

 const scale=.72+rand()*.72;
 const h=heightAt(x,z);

 dummy.position.set(x,h+1.85*scale,z);
 dummy.rotation.y=rand()*6.28;
 dummy.scale.set(scale,scale,scale);
 dummy.updateMatrix();
 trunks.setMatrixAt(ti++,dummy.matrix);

 for(let j=0;j<3;j++){
  dummy.position.set(
   x+(rand()-.5)*.65*scale,
   h+(3.1+j*.62)*scale,
   z+(rand()-.5)*.65*scale
  );

  dummy.rotation.set(rand()*.2,rand()*6.28,rand()*.2);

  const s=(1.05+rand()*.3)*scale;
  dummy.scale.set(s,s*.88,s);
  dummy.updateMatrix();

  crowns.setMatrixAt(ci++,dummy.matrix);
 }
}

trunks.count=ti;
crowns.count=ci;
scene.add(trunks,crowns);

// Instanced rocks
const rockGeo=new THREE.DodecahedronGeometry(1,1);
const rockMat=new THREE.MeshStandardMaterial({
 color:0x77796e,
 roughness:1
});

const rocks=new THREE.InstancedMesh(rockGeo,rockMat,230);
rocks.castShadow=true;

for(let i=0;i<230;i++){
 let x=(rand()-.5)*220;
 const z=(rand()-.5)*220;

 if(nearTrack(x,z))x+=12;

 dummy.position.set(x,heightAt(x,z)+.22,z);
 dummy.rotation.set(rand()*1.2,rand()*6.28,rand()*1.2);

 const s=.25+rand()*.85;
 dummy.scale.set(
  s,
  s*(.4+rand()*.35),
  s*(.8+rand()*.4)
 );

 dummy.updateMatrix();
 rocks.setMatrixAt(i,dummy.matrix);
}
scene.add(rocks);

// Instanced grass
const grassGeo=new THREE.ConeGeometry(.075,.65,4);
grassGeo.translate(0,.32,0);

const grassMat=new THREE.MeshStandardMaterial({
 color:0x71864a,
 roughness:1,
 side:THREE.DoubleSide
});

const grass=new THREE.InstancedMesh(grassGeo,grassMat,3600);

for(let i=0;i<3600;i++){
 let x=(rand()-.5)*230;
 const z=(rand()-.5)*230;

 if(nearTrack(x,z))x+=12;

 dummy.position.set(x,heightAt(x,z)+.05,z);
 dummy.rotation.set(0,rand()*6.28,(rand()-.5)*.22);

 const s=.45+rand()*.8;
 dummy.scale.set(s,s,s);
 dummy.updateMatrix();

 grass.setMatrixAt(i,dummy.matrix);
}

scene.add(grass);

// Third-person player model
const player=new THREE.Group();
scene.add(player);

const cloth=new THREE.MeshStandardMaterial({
 color:0x354f3b,
 roughness:.9
});
const trousers=new THREE.MeshStandardMaterial({
 color:0x343a32,
 roughness:1
});
const skin=new THREE.MeshStandardMaterial({
 color:0x8d6045,
 roughness:.85
});
const packMat=new THREE.MeshStandardMaterial({
 color:0x755638,
 roughness:1
});

function part(geo,mat,parent,x,y,z){
 const m=new THREE.Mesh(geo,mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 parent.add(m);
 return m;
}

part(
 new THREE.CapsuleGeometry(.36,.72,5,8),
 cloth,player,0,1.28,0
);

part(
 new THREE.SphereGeometry(.255,16,12),
 skin,player,0,2.02,0
);

part(
 new THREE.BoxGeometry(.42,.48,.22),
 packMat,player,0,1.35,-.34
);

const limbs=[];

for(let side of [-1,1]){
 const arm=new THREE.Group();
 arm.position.set(side*.43,1.62,0);
 player.add(arm);

 part(
  new THREE.CapsuleGeometry(.105,.48,4,7),
  cloth,arm,0,-.28,0
 );
 limbs.push(arm);

 const leg=new THREE.Group();
 leg.position.set(side*.19,.78,0);
 player.add(leg);

 part(
  new THREE.CapsuleGeometry(.14,.62,4,7),
  trousers,leg,0,-.28,0
 );

 part(
  new THREE.BoxGeometry(.2,.12,.34),
  packMat,leg,0,-.59,.09
 );

 limbs.push(leg);
}

player.position.set(0,heightAt(0,0),0);

// Mobile controls
let yaw=0,pitch=.19;
let moveX=0,moveY=0;
let joyId=null,lookId=null;
let lastX=0,lastY=0;

const joy=document.getElementById('joystick');
const stick=document.getElementById('stick');
const look=document.getElementById('look');
const status=document.getElementById('status');

function setJoy(e){
 const r=joy.getBoundingClientRect();
 const dx=e.clientX-r.left-r.width/2;
 const dy=e.clientY-r.top-r.height/2;
 const len=Math.hypot(dx,dy)||1;
 const k=Math.min(1,38/len);
 const x=dx*k,y=dy*k;

 stick.style.transform='translate('+x+'px,'+y+'px)';
 moveX=x/38;
 moveY=-y/38;
}

joy.addEventListener('pointerdown',e=>{
 joyId=e.pointerId;
 joy.setPointerCapture(joyId);
 setJoy(e);
});

joy.addEventListener('pointermove',e=>{
 if(e.pointerId===joyId)setJoy(e);
});

function release(e){
 if(e.pointerId!==joyId)return;

 joyId=null;
 moveX=moveY=0;
 stick.style.transform='translate(0,0)';
}

joy.addEventListener('pointerup',release);
joy.addEventListener('pointercancel',release);

look.addEventListener('pointerdown',e=>{
 lookId=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
 look.setPointerCapture(lookId);
});

look.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookId)return;

 yaw-=(e.clientX-lastX)*.006;

 pitch=THREE.MathUtils.clamp(
  pitch+(e.clientY-lastY)*.004,
  -.12,.72
 );

 lastX=e.clientX;
 lastY=e.clientY;
});

look.addEventListener('pointerup',()=>lookId=null);
look.addEventListener('pointercancel',()=>lookId=null);

// Keyboard controls for desktop testing
const keys={};

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
});

addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

// Graphics quality selector
let quality=0;

document.getElementById('quality').addEventListener('click',()=>{
 quality=(quality+1)%3;

 const labels=['BALANCED','PERFORMANCE','HIGH'];

 document.getElementById('quality').textContent=
  'GRAPHICS: '+labels[quality];

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,
   quality===1?1:quality===2?1.6:1.35
  )
 );

 renderer.shadowMap.enabled=quality!==1;
});

// Game loop
const clock=new THREE.Clock();
let elapsed=0;

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);
 elapsed+=dt;

 let mx=moveX,my=moveY;

 if(keys.w||keys.arrowup)my=1;
 if(keys.s||keys.arrowdown)my=-1;
 if(keys.a||keys.arrowleft)mx=-1;
 if(keys.d||keys.arrowright)mx=1;

 const moving=Math.hypot(mx,my)>.08;

 if(moving){
  const speed=keys.shift?8:5.2;

  const dx=(
   mx*Math.cos(yaw)-my*Math.sin(yaw)
  )*speed*dt;

  const dz=(
   -mx*Math.sin(yaw)-my*Math.cos(yaw)
  )*speed*dt;

  player.position.x=THREE.MathUtils.clamp(
   player.position.x+dx,-119,119
  );

  player.position.z=THREE.MathUtils.clamp(
   player.position.z+dz,-119,119
  );

  player.rotation.y=Math.atan2(dx,dz);

  const swing=Math.sin(elapsed*10)*.55;

  limbs[0].rotation.x=swing;
  limbs[1].rotation.x=-swing;
  limbs[2].rotation.x=-swing;
  limbs[3].rotation.x=swing;

 }else{
  limbs.forEach(l=>{
   l.rotation.x=THREE.MathUtils.damp(
    l.rotation.x,0,9,dt
   );
  });
 }

 player.position.y=heightAt(
  player.position.x,
  player.position.z
 );

 const d=7.5;

 const target=new THREE.Vector3(
  player.position.x+Math.sin(yaw)*d*Math.cos(pitch),
  player.position.y+2+Math.sin(pitch)*d,
  player.position.z+Math.cos(yaw)*d*Math.cos(pitch)
 );

 camera.position.lerp(target,1-Math.pow(.001,dt));

 camera.lookAt(
  player.position.x,
  player.position.y+1.25,
  player.position.z
 );

 status.textContent=moving?
  'EXPLORING THE FRONTIER':
  'WORLD READY';

 renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('loading').style.display='none';
</script>
</body>
</html>
